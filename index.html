<div class="app"><nav class="sb" id="sb" aria-label="Main navigation"></nav><div><div class="mtop"><button class="b" id="mn" aria-label="Open menu"></button><span class="brand" style="padding:0">SudoZen</span></div><main id="main"></main></div></div>
<div id="m" hidden></div><div class="t" id="t" role="status" aria-live="polite" hidden></div>
<script>
const $=s=>document.querySelector(s);
const sg=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('sz_'+k));return v==null?d:v}catch{return d}},ss=(k,v)=>{try{localStorage.setItem('sz_'+k,JSON.stringify(v))}catch{}};
const P={home:"M3 11l9-8 9 8M5 10v10h14V10",play:"M7 4l13 8-13 8z",cal:"M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",clock:"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2",chart:"M4 20V10M10 20V4M16 20v-8M22 20H2",cup:"M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 20h8",book:"M4 5h7a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-7v15h7z",gear:"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4",info:"M12 3a9 9 0 100 18 9 9 0 000-18zM12 11v6M12 7.5v.5",undo:"M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3",redo:"M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3",era:"M20 20H9L4 15l10-10 6 6-7 7",pen:"M4 20l1-5L16 4l4 4L9 19z",bulb:"M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5V16h8v-2.5A6 6 0 0012 3z",pause:"M8 5v14M16 5v14",chk:"M5 12l5 5 9-10",rot:"M4 12a8 8 0 108-8H7M7 1v6h6",menu:"M4 6h16M4 12h16M4 18h16",back:"M15 5l-7 7 7 7",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z",plus:"M12 5v14M5 12h14"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const logo=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><path d="M31 11A15 15 0 1 0 35 22" fill="none" stroke="var(--lav)" stroke-width="2.5" stroke-linecap="round"/>${[...Array(9)].map((_,i)=>`<rect x="${11+i%3*7}" y="${11+(i/3|0)*7}" width="5" height="5" rx="1" fill="${i==4?'var(--ac)':'currentColor'}" opacity="${i==4?1:.55}"/>`).join('')}</svg>`;
/* ---------- engine ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const shuf=(a,R)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ok=(g,i,v)=>{const r=i/9|0,c=i%9;for(let k=0;k<9;k++)if(g[r*9+k]===v||g[k*9+c]===v)return false;const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(g[(br+a)*9+bc+b]===v)return false;return true};
const cands=(g,i)=>{const m=[];for(let v=1;v<=9;v++)if(ok(g,i,v))m.push(v);return m};
const fill=(g,R)=>{const i=g.indexOf(0);if(i<0)return true;for(const v of shuf([1,2,3,4,5,6,7,8,9],R))if(ok(g,i,v)){g[i]=v;if(fill(g,R))return true;g[i]=0}return false};
const count=(g,lim)=>{let b=-1,bc=null;for(let i=0;i<81;i++)if(!g[i]){const c=cands(g,i);if(!c.length)return 0;if(!bc||c.length<bc.length){b=i;bc=c;if(c.length===1)break}}if(b<0)return 1;let n=0;for(const v of bc){g[b]=v;n+=count(g,lim-n);g[b]=0;if(n>=lim)break}return n};
const unit=u=>{const k=u%9,t=u/9|0,a=[];for(let j=0;j<9;j++)a.push(t===0?k*9+j:t===1?j*9+k:((k/3|0)*3+(j/3|0))*9+(k%3)*3+j%3);return a};
const logic=(p,h)=>{const g=p.slice();let ch=1;while(ch){ch=0;for(let i=0;i<81;i++)if(!g[i]){const c=cands(g,i);if(c.length===1){g[i]=c[0];ch=1}}
if(h&&!ch)for(let u=0;u<27&&!ch;u++){const cs=unit(u);for(let v=1;v<=9&&!ch;v++){if(cs.some(i=>g[i]===v))continue;const w=cs.filter(i=>!g[i]&&ok(g,i,v));if(w.length===1){g[w[0]]=v;ch=1}}}}return g.every(Boolean)};
/* Difficulty = clue target + required technique: Easy needs only naked singles, Medium adds hidden singles, Hard/Expert are sparser (unique solution always verified). */
function gen(d,seed){const R=rng(seed??Math.floor(Math.random()*4294967296)),sol=Array(81).fill(0);fill(sol,R);const p=sol.slice(),T={easy:40,medium:34,hard:29,expert:24}[d];let cl=81;
for(const i of shuf([...Array(81).keys()],R)){if(cl<=T)break;const v=p[i];p[i]=0;if(count(p.slice(),2)!==1||(d==='easy'&&!logic(p,0))||(d==='medium'&&!logic(p,1)))p[i]=v;else cl--}return{puz:p,sol}}
const peers=i=>{const r=i/9|0,c=i%9,a=[];for(let j=0;j<81;j++){if(j===i)continue;const q=j/9|0,w=j%9;if(q===r||w===c||((q/3|0)===(r/3|0)&&(w/3|0)===(c/3|0)))a.push(j)}return a};
/* ---------- state ---------- */
const DEF={theme:'dark',acc:'teal',compact:0,diff:'easy',auto:1,match:1,rel:1,autoN:1,cRes:1,cNew:1,hc:0,rm:0,size:100,snd:0,tim:1};
let S=Object.assign({},DEF,sg('set',{}));
let H=sg('hist',[]);H=Array.isArray(H)?H.filter(h=>h&&typeof h.time==='number'&&h.diff&&h.res):[];
let ST=sg('st',{started:0});if(!ST||typeof ST.started!=='number')ST={started:0};
let AC=sg('ach',{});if(!AC||typeof AC!=='object')AC={};
const okG=g=>g&&['puz','sol','cur','notes'].every(k=>Array.isArray(g[k])&&g[k].length===81)&&typeof g.el==='number';
let G=sg('game',null);if(!okG(G))G=null;else{G.mist|=0;G.hints|=0}
let BK=null,LAST=null,sel=-1,notesOn=false,route='home',busy=false,QI=Math.floor(Math.random()*6),undo=[],redo=[],bad=new Set(),flash=-1,INFO='',nm='classic',nd=S.diff,mres=null,EX=null,tt,ac;
const D={easy:'Easy',medium:'Medium',hard:'Hard',expert:'Expert'},MD={classic:'Classic',zen:'Zen',challenge:'Challenge'};
const QS=['Clarity begins when you slow down.','One square at a time. One thought at a time.','The solution is closer than you think.','Patience turns patterns into possibilities.','Focus on the next number, not the entire puzzle.','A calm mind sees what a rushed mind misses.'];
const today=()=>new Date().toLocaleDateString('en-CA'),fm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const dDiff=()=>['easy','easy','medium','medium','hard','hard','expert'][new Date().getDay()];
const sv=()=>{if(G&&!G.tut)ss('game',G)},W=()=>H.filter(h=>h.res==='won');
function dayStreak(){const d=[...new Set(W().map(h=>new Date(h.t).toLocaleDateString('en-CA')))].sort();let b=d.length?1:0,r=1;for(let i=1;i<d.length;i++){r=(new Date(d[i])-new Date(d[i-1]))/864e5===1?r+1:1;b=Math.max(b,r)}return b}
const AL=[['first','First Steps','Complete your first puzzle.',()=>[W().length,1]],['zen','Zen Beginner','Complete an Easy puzzle.',()=>[W().filter(h=>h.diff==='easy').length,1]],['five','Pattern Seeker','Complete five puzzles.',()=>[W().length,5]],['daily','Daily Focus','Complete a daily challenge.',()=>[W().filter(h=>h.daily).length,1]],['flaw','Flawless Mind','Complete a Classic or Challenge puzzle with no mistakes.',()=>[W().filter(h=>!h.mist&&h.mode!=='zen').length,1]],['streak','Consistent Thinker','Complete puzzles on 2 days in a row.',()=>[dayStreak(),2]],['expert','Master of Patterns','Complete an Expert puzzle.',()=>[W().filter(h=>h.diff==='expert').length,1]]];
function sts(){const w=W(),n=w.length;let cur=0;for(const h of H){if(h.res==='won')cur++;else break}let bst=0,run=0;for(const h of [...H].reverse()){h.res==='won'?bst=Math.max(bst,++run):run=0}return{n,cur,bst,avg:n?Math.round(w.reduce((a,h)=>a+h.time,0)/n):0}}
function rec(res){if(G.tut)return;H.unshift({id:G.id,t:Date.now(),mode:G.mode,diff:G.diff,daily:G.daily||'',res,time:G.el,mist:G.mist,hints:G.hints});H=H.slice(0,300);ss('hist',H)}
function ach(){const nw=[];AL.forEach(a=>{const[c,m]=a[3]();if(!AC[a[0]]&&c>=m){AC[a[0]]=Date.now();nw.push(a[1])}});ss('ach',AC);return nw}
function beep(f){if(!S.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch{}}
function toast(m,k='ok'){const t=$('#t');t.className='t '+k;t.textContent=(k==='err'?'✕ ':k==='warn'?'! ':'✓ ')+m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3400)}
const modal=h=>{$('#m').innerHTML=`<div class="mb" role="dialog" aria-modal="true">${h}</div>`;$('#m').hidden=false;$('#m .b')?.focus()},closeM=()=>{$('#m').hidden=true;$('#m').innerHTML=''};
const ask=(t,m,o)=>new Promise(r=>{mres=r;modal(`<h2>${t}</h2><p>${m}</p><div class="row"><button class="b" data-do="mr:0">Cancel</button><button class="b p" data-do="mr:1">${o}</button></div>`)});
const go=r=>{if(location.hash==='#'+r)render();else location.hash=r};
/* ---------- game actions ---------- */
async function begin(mode,diff,daily){if(G&&!G.tut&&!G.done){if(daily&&G.daily===daily)return go('game');if(S.cNew&&!await ask('Start a new game?',`Your unfinished ${D[G.diff]} puzzle will be marked abandoned in your history. Abandoning ends your current win streak.`,'Abandon and start new'))return;rec('abandoned')}
busy=true;render();setTimeout(()=>{const r=gen(diff,daily?hash(daily):undefined);G={id:Date.now(),mode,diff,daily:daily||'',puz:r.puz,sol:r.sol,cur:r.puz.slice(),notes:Array(81).fill(0),el:0,paused:0,mist:0,hints:0,done:0};ST.started++;ss('st',ST);sv();undo=[];redo=[];sel=-1;notesOn=false;bad=new Set();INFO='';busy=false;go('game')},40)}
const snap=()=>{undo.push({c:G.cur.slice(),n:G.notes.slice()});if(undo.length>150)undo.shift();redo=[]};
const tut=n=>{if(G&&G.tut&&G.tutS===n)G.tutS++};
const live=()=>G&&!G.paused&&!G.done;
function put(v){if(!live()||sel<0)return toast('Select an empty cell first.','warn');const g=G;if(g.puz[sel])return toast('Clue numbers are part of the puzzle and can’t be changed.','warn');
bad.clear();flash=-1;
if(notesOn){if(g.cur[sel])return toast('Erase this cell first to add notes.','warn');snap();g.notes[sel]^=1<<v;tut(2)}
else{if(g.cur[sel]===v)return;snap();g.cur[sel]=v;g.notes[sel]=0;if(S.autoN)peers(sel).forEach(j=>g.notes[j]&=~(1<<v));
if(v!==g.sol[sel]&&g.mode!=='zen'){g.mist++;beep(180);toast('That number doesn’t match the solution. Mistake added.','err')}else beep(520);tut(1);
if(g.mode==='challenge'&&g.mist>=3)return lose();if(g.cur.every((x,i)=>x===g.sol[i]))return win()}
